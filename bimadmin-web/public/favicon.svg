<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Squared ground with a small radius, not a dome. Flat fill. -->
  <rect width="64" height="64" rx="14" fill="#1F6E68"/>
  <!--
    Favicon carries the B alone, deliberately.
    An overlapping B and A becomes an unreadable smudge at 16px, which is
    the size that actually matters in a browser tab. The overlapping BA
    lockup lives in src/components/shared/Logo.tsx and is used at 24px and
    above, where the overlap is legible and does the work it is meant to.
  -->
  <path d="M20 15h13.4c6.7 0 10.8 3.2 10.8 8.4 0 3.4-1.8 5.9-4.9 7.1 3.9 1 6.3 3.9 6.3 8 0 5.8-4.4 9.5-11.6 9.5H20V15zm12.2 12.6c2.8 0 4.4-1.3 4.4-3.5s-1.6-3.4-4.4-3.4h-4.9v6.9h4.9zm.9 13.2c3.1 0 4.9-1.4 4.9-3.9s-1.8-3.9-4.9-3.9h-5.8v7.8h5.8z" fill="#F6F4EF"/>
  <!-- Ochre keyline at the base, echoing the horizon used across the app. -->
  <rect x="20" y="52" width="24" height="2.5" rx="1.25" fill="#C68A2E"/>
</svg>
